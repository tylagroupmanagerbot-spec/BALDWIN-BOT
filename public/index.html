<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALDWIN 1000</title><style>body{margin:0;background:#070a12;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:12px}.c{width:100%;max-width:420px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;backdrop-filter:blur(20px)}.t{display:flex;gap:4px;background:#000;padding:3px;border-radius:10px;margin:10px 0}.b{flex:1;padding:8px;border:0;border-radius:8px;background:0;color:#888;font-weight:700;font-size:10px}.b.a{background:#fff;color:#000}input{width:100%;padding:12px;border-radius:10px;background:#000;border:1px solid #333;color:#fff}button{width:100%;padding:12px;border-radius:10px;border:0;background:linear-gradient(90deg,#a855f7,#22d3ee);color:#fff;font-weight:800;margin-top:8px}.g{max-height:300px;overflow:auto;display:grid;gap:6px;margin-top:8px}.f{display:flex;justify-content:space-between;padding:8px;background:#111;border-radius:8px;font-size:10px}.o{width:28px;height:16px;background:#333;border-radius:99px;position:relative}.o.on{background:#22c55e}.o::after{content:'';position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}.o.on::after{left:14px}.code{font-size:28px;text-align:center;letter-spacing:.2em;margin:8px 0}</style></head><body><div class="c"><b>BALDWIN BOT</b> • 1000 Features • SIMON TECH<div class="t"><button class="b a" id="p1" onclick="m('p')">PAIR</button><button class="b" id="p2" onclick="m('q')">QR</button><button class="b" id="p3" onclick="m('f')">FEAT</button><button class="b" id="p4" onclick="m('a')">ADMIN</button></div><div id="v1"><input id="ph" value="2349166265317"><button onclick="pair()">Generate Code ⚡</button><div id="cd" class="code">--------</div><div id="msg" style="font-size:10px;text-align:center"></div></div><div id="v2" style="display:none;text-align:center"><div id="qr" style="background:#fff;color:#000;padding:40px;border-radius:12px">QR here</div><button onclick="qr()">Refresh QR</button></div><div id="v3" style="display:none"><input id="sf" placeholder="Search 1000" oninput="fil('sf','g1')"><div id="g1" class="g"></div></div><div id="v4" style="display:none"><input id="pin" type="password" placeholder="PIN 0916"><button onclick="un()">Unlock 👑</button><div id="ap" style="display:none"><input id="sa" placeholder="Search" oninput="fil('sa','g2')"><div id="g2" class="g"></div></div></div></div><script>let PIN='',F={};function m(x){['p','q','f','a'].forEach(y=>{document.getElementById('v'+(y=='p'?1:y=='q'?2:y=='f'?3:4)).style.display=x==y?'block':'none';document.getElementById('p'+(y=='p'?1:y=='q'?2:y=='f'?3:4)).classList.toggle('a',x==y)});if(x=='q')qr();if(x=='f')lf()}async function pair(){let p=document.getElementById('ph').value.replace(/\D/g,'');let r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneNumber:p})});let d=await r.json();if(d.code||d.pairingCode){document.getElementById('cd').textContent=d.code||d.pairingCode;document.getElementById('msg').textContent='Expires 60s'}else document.getElementById('msg').textContent=d.error}async function qr(){document.getElementById('qr').textContent='Generating...';await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'qr'})});let s=await (await fetch('/api/status')).json();if(s.qr)document.getElementById('qr').innerHTML='<img src="'+s.qr+'" style="width:180px">' }async function lf(){let r=await fetch('/api/features');F=await r.json();let g=document.getElementById('g1');g.innerHTML='';Object.entries(F).forEach(([k,v])=>g.innerHTML+=`<div class="f" data-k="${k}"><span>${k}</span><div class="o ${v?'on':''}"></div></div>`)}function fil(inp,grid){let q=document.getElementById(inp).value.toLowerCase();document.querySelectorAll('#'+grid+' .f').forEach(e=>e.style.display=e.dataset.k.toLowerCase().includes(q)?'flex':'none')}async function un(){PIN=document.getElementById('pin').value;let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN})});let d=await r.json();if(!d.success)return alert('Wrong PIN');document.getElementById('ap').style.display='block';let f=await (await fetch('/api/features')).json();let g=document.getElementById('g2');g.innerHTML='';Object.entries(f).forEach(([k,v])=>g.innerHTML+=`<div class="f" data-k="${k}"><span>${k}</span><div class="o ${v?'on':''}" onclick="tog('${k}',${!v})"></div></div>`)}async function tog(k,v){await fetch('/api/features',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,key:k,value:v})});un()}setInterval(async()=>{let s=await (await fetch('/api/status')).json();if(s.qr)document.getElementById('qr').innerHTML='<img src="'+s.qr+'" style="width:180px">';if(s.code)document.getElementById('cd').textContent=s.code},3000);lf()</script></body></html>
