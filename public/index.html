<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baldwin Bot | Simon Tech Inc</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070a12;--card:rgba(17,21,35,.75);--border:rgba(255,255,255,.08);--accent:#7c3aed;--accent2:#22d3ee;--green:#22c55e}
body{min-height:100vh;font-family:'Space Grotesk',sans-serif;display:flex;justify-content:center;align-items:center;padding:16px;color:#fff;background:radial-gradient(800px 400px at 15% -10%,rgba(124,58,237,.35),transparent),radial-gradient(600px 300px at 90% 110%,rgba(34,211,238,.25),transparent),var(--bg);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:url("/background.jpg") center/cover;opacity:.18;z-index:-1;filter:blur(2px)}
.card{width:100%;max-width:440px;padding:32px 26px 22px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)) , var(--card);border:1px solid var(--border);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);animation:pop .6s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.top-badge{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.badge{font-size:11px;letter-spacing:.12em;padding:7px 12px;border-radius:100px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:#aab}
.badge.live{color:#86efac;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.25)}
.logo{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{margin:8px 0 22px;color:#9aa3b8;font-size:13.5px;line-height:1.6}
.tabs{display:flex;gap:8px;padding:5px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:14px;margin-bottom:20px}
.tab{flex:1;padding:11px;border-radius:10px;border:0;background:transparent;color:#8b95ad;font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.tab.active{background:#fff;color:#000;box-shadow:0 6px 20px rgba(255,255,255,.25)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 4px rgba(34,197,94,.2);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.input-wrap{position:relative;margin-bottom:14px}
.input{width:100%;padding:17px 18px 17px 46px;border:1px solid var(--border);border-radius:14px;outline:none;background:rgba(0,0,0,.55);color:white;font-size:15px;transition:.2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,58,237,.2)}
.icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.6}
.button{width:100%;border:0;padding:17px;border-radius:14px;cursor:pointer;font-size:14.5px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;transition:.2s;position:relative;overflow:hidden}
.button::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:translateX(-100%);transition:.6s}
.button:hover::after{transform:translateX(100%)}
.button:disabled{opacity:.6}
.result{display:none;margin-top:20px;padding:18px;border-radius:18px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.15);animation:pop .4s}
.result.show{display:block}
.code{font-family:'JetBrains Mono',monospace;margin:14px 0;font-size:36px;font-weight:800;letter-spacing:.18em;text-align:center;color:#fff;text-shadow:0 0 20px rgba(124,58,237,.6)}
.qrbox{margin:12px auto;width:260px;height:260px;background:#fff;border-radius:18px;display:grid;place-items:center;overflow:hidden}
.qrbox img{width:100%;height:100%;object-fit:contain;padding:10px}
.actions{display:flex;gap:10px;margin-top:12px}
.small{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.small.primary{background:#fff;color:#000}
.message{margin-top:14px;font-size:12.5px;line-height:1.6;color:#aab;text-align:center}
.error{color:#fda4af !important}
.footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6b7280;border-top:1px solid var(--border);padding-top:14px}
.footer b{color:#9aa3b8}
</style>
</head>
<body>
<div class="card">
<div class="top-badge">
<div class="badge">SIMON TECH INC</div>
<div class="badge live"><span class="status-dot"></span> <span id="status">Checking...</span></div>
</div>

<div class="logo"><span>BALDWIN</span> BOT</div>
<div class="subtitle">WhatsApp Multi-Device pairing. Owner: <b style="color:#fff">Simon Tech</b> • 09166265317<br>Secure, fast and auto-reconnecting.</div>

<div class="tabs">
<button class="tab active" id="tabPair" onclick="switchMode('pair')">Pairing Code</button>
<button class="tab" id="tabQr" onclick="switchMode('qr')">QR Code</button>
</div>

<div id="pairView">
<div class="input-wrap">
<div class="icon">📱</div>
<input id="phone" class="input" type="tel" inputmode="numeric" value="2349166265317" placeholder="2349166265317">
</div>
<button id="pairButton" class="button" onclick="generatePairingCode()">Generate 8-Digit Code</button>
</div>

<div id="qrView" style="display:none;text-align:center">
<div class="qrbox" id="qrbox"><span style="color:#999;font-size:12px">QR will appear here</span></div>
<button class="button" style="margin-top:14px;background:rgba(255,255,255,.08);border:1px solid var(--border)" onclick="requestQR()">Refresh QR</button>
</div>

<div id="result" class="result">
<div style="font-size:11px;letter-spacing:.15em;color:#aab;text-align:center">YOUR PAIRING CODE</div>
<div id="code" class="code">--------</div>
<div class="actions">
<button class="small primary" onclick="copyCode()">Copy Code</button>
<button class="small" onclick="generatePairingCode()">Regenerate</button>
</div>
<div class="message">WhatsApp → Linked Devices → Link Device → Link with phone number</div>
</div>

<div id="message" class="message"></div>

<div class="footer">
<div>© 2026 <b>Baldwin iv x sultan Saladi</b></div>
<div><b id="connInfo">Not Connected</b></div>
</div>
</div>

<script>
let currentMode='pair'
const statusEl=document.getElementById('status')
const connInfo=document.getElementById('connInfo')
const resultEl=document.getElementById('result')
const codeEl=document.getElementById('code')
const msgEl=document.getElementById('message')
const btn=document.getElementById('pairButton')
const qrbox=document.getElementById('qrbox')

function switchMode(m){
 currentMode=m
 document.getElementById('tabPair').classList.toggle('active',m==='pair')
 document.getElementById('tabQr').classList.toggle('active',m==='qr')
 document.getElementById('pairView').style.display=m==='pair'?'block':'none'
 document.getElementById('qrView').style.display=m==='qr'?'block':'none'
 fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})}).catch(()=>fetch('/setmode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})}))
 if(m==='qr') requestQR()
}
async function checkStatus(){
 try{
  let r=await fetch('/api/status'); if(!r.ok) r=await fetch('/info')
  const d=await r.json()
  const connected=d.connected||d.isConnected
  statusEl.textContent=connected?'Connected':'● '+ (d.status||d.mode||'Waiting')
  connInfo.textContent=connected? 'CONNECTED: '+(d.number||d.phone||'') : (d.qr?'QR Ready':'Not Connected')
  if(d.qr && currentMode==='qr'){
   qrbox.innerHTML=`<img src="${d.qr}" alt="qr">`
  }
  if(d.code && d.code.length>=4){
   codeEl.textContent=d.code
   resultEl.classList.add('show')
  }
 }catch{statusEl.textContent='Offline'}
}
async function generatePairingCode(){
 const phone=document.getElementById('phone').value.replace(/\D/g,'')
 if(!phone){setErr('Enter number with country code');return}
 btn.disabled=true; btn.textContent='Generating...'; msgEl.textContent=''
 try{
  let response=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneNumber:phone,number:phone})})
  if(!response.ok){ response=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:phone})}) }
  const data=await response.json()
  const code=data.pairingCode||data.code
  if(!code) throw new Error(data.message||data.error||'Failed')
  codeEl.textContent=code; resultEl.classList.add('show'); resultEl.style.display='block'
  msgEl.textContent='Code generated! Expires in 60s'; msgEl.className='message'
 }catch(e){setErr(e.message)}finally{btn.disabled=false;btn.textContent='Generate 8-Digit Code'}
}
async function requestQR(){
 qrbox.innerHTML='<span style="color:#999">Generating QR...</span>'
 try{
  await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'qr'})})
 }catch{}
}
function copyCode(){navigator.clipboard.writeText(codeEl.textContent);msgEl.textContent='Copied to clipboard!';}
function setErr(t){msgEl.textContent=t;msgEl.className='message error'}
checkStatus();setInterval(checkStatus,2500)
</script>
</body>
</html>
