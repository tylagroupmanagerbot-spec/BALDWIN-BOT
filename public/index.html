<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALDWIN BOT | 1000 Features</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--a:#a855f7;--b:#22d3ee;--g:#22c55e}
body{min-height:100vh;font-family:'Space Grotesk',sans-serif;display:flex;justify-content:center;padding:16px;color:#fff;background:#070a12;overflow-x:hidden}
.card{width:100%;max-width:440px;padding:24px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px)}
.logo{font-size:30px;font-weight:700}.logo span{background:linear-gradient(90deg,#c084fc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.5);padding:4px;border-radius:12px;margin:14px 0}
.tab{flex:1;padding:10px;border-radius:9px;border:0;background:transparent;color:#999;font-weight:700;cursor:pointer}.tab.active{background:#fff;color:#000}
.input{width:100%;padding:15px 14px 15px 40px;border-radius:12px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);color:#fff;outline:none}
.btn{width:100%;padding:15px;border-radius:12px;border:0;background:linear-gradient(90deg,#a855f7,#22d3ee);color:#fff;font-weight:800;cursor:pointer;margin-top:10px}
.result{display:none;margin-top:14px;padding:14px;border-radius:14px;background:rgba(168,85,247,.15);border:1px dashed rgba(168,85,247,.4);text-align:center}.result.show{display:block}
.code{font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:.15em;margin:10px 0;text-shadow:0 0 20px #a855f7}
.logbox{background:#000;border-radius:12px;padding:10px;height:140px;overflow:auto;font-family:monospace;font-size:10px;color:#0f0;margin-top:12px;border:1px solid #222}
.featGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;max-height:300px;overflow:auto}
.feat{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(0,0,0,.5);border-radius:10px;border:1px solid rgba(255,255,255,.06);font-size:11px}
.tog{width:32px;height:18px;background:#333;border-radius:100px;position:relative;cursor:pointer}.tog.on{background:#22c55e}.tog::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.2s}.tog.on::after{left:16px}
.qrbox{width:220px;height:220px;background:#fff;border-radius:16px;margin:10px auto;display:grid;place-items:center;overflow:hidden}
.qrbox img{width:100%;height:100%;padding:8px}
</style></head><body>
<div class="card">
<div style="display:flex;justify-content:space-between;font-size:10px;color:#888"><span>SIMON TECH INC</span><span id="status">● Waiting</span></div>
<div class="logo"><span>BALDWIN</span> BOT</div>
<div style="font-size:11px;color:#999;margin:6px 0">Owner: Simon Tech • 1000 Features • PIN: 0916</div>

<div class="tabs">
<button class="tab active" id="tPair" onclick="mode('pair')">Pair Code</button>
<button class="tab" id="tQr" onclick="mode('qr')">QR Scan</button>
<button class="tab" id="tFeat" onclick="mode('feat')">Features</button>
<button class="tab" id="tAdmin" onclick="mode('admin')">Admin</button>
</div>

<div id="pairV">
<div style="position:relative"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%)">📱</span><input id="phone" class="input" value="2349166265317"></div>
<button class="btn" id="pairBtn" onclick="gen()">Generate 8-Digit Code ⚡</button>
<div id="result" class="result"><div style="font-size:9px;color:#c4b5fd;letter-spacing:.2em">YOUR CODE</div><div id="code" class="code">--------</div><button class="btn" style="background:#fff;color:#000;padding:8px" onclick="navigator.clipboard.writeText(document.getElementById('code').innerText)">Copy</button>
<div style="font-size:10px;color:#999;margin-top:8px">Linked Devices → Link with phone number</div></div>
</div>

<div id="qrV" style="display:none;text-align:center"><div class="qrbox" id="qrbox">QR here</div><button class="btn" style="background:#222" onclick="refreshQR()">Refresh QR</button></div>

<div id="featV" style="display:none"><input id="search" class="input" style="padding-left:14px" placeholder="Search 1000 features..." oninput="filterFeat()"><div class="featGrid" id="featGrid"></div></div>

<div id="adminV" style="display:none"><input id="pin" type="password" class="input" style="padding-left:14px" placeholder="Enter PIN (0916)"><button class="btn" onclick="unlock()">Unlock Admin 🔓</button><div id="adminControls" style="display:none;margin-top:10px"><div style="display:flex;gap:6px"><button class="btn" style="flex:1;background:#222" onclick="setAll(true)">ON All</button><button class="btn" style="flex:1;background:#222" onclick="setAll(false)">OFF All</button></div><div id="adminGrid" class="featGrid"></div></div></div>

<div class="logbox" id="logs">Initializing Baldwin bot...
[BOOT] Loading modules (1 min simulation)
</div>

<div style="margin-top:10px;font-size:10px;color:#666;display:flex;justify-content:space-between"><span id="uptime">Uptime: 0s</span><span id="cmds">Commands: 0</span></div>
</div>

<script>
let cur='pair', PIN='', allFeatures={};
function mode(m){cur=m;['pair','qr','feat','admin'].forEach(x=>{document.getElementById(x+'V').style.display=m===x?'block':'none';document.getElementById('t'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',m===x)}); if(m==='qr') refreshQR(); if(m==='feat') loadFeat();}
async function gen(){const p=document.getElementById('phone').value.replace(/\D/g,''); const b=document.getElementById('pairBtn'); b.disabled=true; b.textContent='Cleaning...'; try{let r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneNumber:p})}); let d=await r.json(); if(!r.ok && r.status===409){log('Old session deleted, retry in 5s...'); await new Promise(x=>setTimeout(x,5000)); r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneNumber:p})}); d=await r.json();} if(!d.code &&!d.pairingCode) throw new Error(d.error||'Failed'); document.getElementById('code').textContent=d.code||d.pairingCode; document.getElementById('result').classList.add('show'); log('Code generated: '+(d.code||d.pairingCode));}catch(e){log('Error: '+e.message)} b.disabled=false; b.textContent='Generate 8-Digit Code ⚡';}
async function refreshQR(){document.getElementById('qrbox').textContent='Generating...'; await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'qr'})}); setTimeout(check,2000);}
async function check(){try{let r=await fetch('/api/status'); let d=await r.json(); document.getElementById('status').textContent=d.connected?'● Connected':'● '+d.status; document.getElementById('uptime').textContent='Uptime: '+Math.floor(d.uptime/60)+'m'; document.getElementById('cmds').textContent='Commands: '+(d.commands||0); if(d.qr) document.getElementById('qrbox').innerHTML='<img src="'+d.qr+'">'; if(d.code) {document.getElementById('code').textContent=d.code; document.getElementById('result').classList.add('show');} }catch{}}
async function loadFeat(){let r=await fetch('/api/features'); allFeatures=await r.json(); renderFeat(allFeatures,'featGrid',false);}
function renderFeat(obj,id,admin){let g=document.getElementById(id); g.innerHTML=''; Object.entries(obj).forEach(([k,v])=>{g.innerHTML+=`<div class="feat" data-k="${k}"><span>${k}</span><div class="tog ${v?'on':''}" onclick="${admin?'toggleAdmin':'toggleView'}('${k}',${!v})"></div></div>`});}
function filterFeat(){let q=document.getElementById('search').value.toLowerCase(); document.querySelectorAll('#featGrid.feat').forEach(el=>{el.style.display=el.dataset.k.toLowerCase().includes(q)?'flex':'none';});}
async function toggleView(k,v){log(k+' view '+v);}
async function unlock(){PIN=document.getElementById('pin').value; let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN})}); let d=await r.json(); if(!d.success) return alert('Wrong PIN'); document.getElementById('adminControls').style.display='block'; let f=await (await fetch('/api/features')).json(); renderFeat(f,'adminGrid',true);}
async function toggleAdmin(k,v){let r=await fetch('/api/features',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,key:k,value:v})}); if(r.ok){allFeatures[k]=v; loadFeat(); let f=await (await fetch('/api/features')).json(); renderFeat(f,'adminGrid',true); log(k+' -> '+(v?'ON':'OFF'));}}
async function setAll(val){if(!confirm('Turn '+(val?'ON':'OFF')+' all 1000?')) return; for(let k of Object.keys(allFeatures)){await fetch('/api/features',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,key:k,value:val})});} loadFeat(); let f=await (await fetch('/api/features')).json(); renderFeat(f,'adminGrid',true);}
function log(t){let b=document.getElementById('logs'); b.innerHTML+='<div>['+new Date().toLocaleTimeString()+'] '+t+'</div>'; b.scrollTop=9999;}
(async()=>{log('Initializing Baldwin bot'); log('Loading 1000 modules...'); for(let i=0;i<5;i++){await new Promise(r=>setTimeout(r,800)); log('Loaded '+(i*200)+' features...');} log('Dashboard ready • 2 Sessions: Pair + QR Terminal');})(); setInterval(check,3000); check(); loadFeat();
</script></body></html>
